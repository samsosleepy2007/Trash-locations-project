name: Sync fallback activity assets
on:
  push:
    branches:
      - fix/imgbb-maintenance-fallback
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/imgbb-maintenance-fallback
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit generated assets
        shell: bash
        run: |
          if git diff --quiet -- assets; then
            echo "Generated assets already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "Sync generated activity assets"
          git push origin HEAD:fix/imgbb-maintenance-fallback
